name: Verify pgAdmin Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v9.19.0
permissions:
  contents: read
concurrency:
  group: pgadmin-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.pgadmin-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.pgadmin', info['package']
              assert info['name'] == 'pgAdmin 4', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'PostgreSQL', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              m = yaml.safe_load(package.extractfile('manifest.yml').read())
              app = m['application']
              assert app['subdomain'] == 'pgadmin', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and u['backend'] == 'http://pgadmin:80/' for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'pgadmin'}, set(svcs)

              svc = svcs['pgadmin']
              assert 'dpage/pgadmin4' in svc['image'], svc['image']
              assert svc['image'].endswith(':' + tag.lstrip('v')), svc['image']

              env = ' '.join(svc['environment'])
              assert 'PGADMIN_DEFAULT_EMAIL=' in env, env
              assert 'PGADMIN_DEFAULT_PASSWORD=' in env, env
              assert '.U.admin_password' in env, env
              # reverse-proxy headers: without these pgAdmin builds absolute
              # URLs against the container's own address
              assert 'PGADMIN_CONFIG_PROXY_X_PROTO_COUNT=1' in env, env
              assert 'PGADMIN_CONFIG_PROXY_X_HOST_COUNT=1' in env, env
              assert 'PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT=0' in env, env
              assert 'PGADMIN_DISABLE_POSTFIX=True' in env, env

              assert any(b.endswith(':/var/lib/pgadmin') for b in svc['binds']), svc['binds']

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {q['id']: q for q in params['params']}
              assert set(by_id) == {'admin_email', 'admin_password'}, set(by_id)
              assert by_id['admin_password']['type'] == 'secret'
              assert 'random' in str(by_id['admin_password'].get('default_value', ''))

              assert 'healthcheck' not in svc, svc
              text = package.extractfile('manifest.yml').read().decode()
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
              # pgAdmin ships the PostgreSQL licence; it is a short header, not a full GPL body
              assert 'PostgreSQL' in license_text, license_text[:200]

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
